<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14212e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Central Stores Manager</title>
<style>
:root{--ink:#14212e;--ink2:#1f3347;--bg:#f4f5f2;--card:#fff;--line:#d9ddd6;--txt:#1b242c;--mute:#66727c;--hi:#f2c230;--ok:#2e7d4f;--bad:#b83a2e}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 "Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:76px}
header{background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{width:38px;height:38px;border-radius:8px;background:#fff;object-fit:contain}
header h1{font-size:18px;margin:0;font-weight:700}
header small{display:block;color:#aebccb;font-size:12px}
main{padding:14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:10px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:3px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 16px;background:var(--ink);color:#fff;cursor:pointer}
button.hi{background:var(--hi);color:var(--ink)}
button.ghost{background:#e8ebe6;color:var(--txt)}
button.full{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
.name{font-weight:700}
.sub{color:var(--mute);font-size:13px}
.qty{font-size:22px;font-weight:700;text-align:right;white-space:nowrap}
.qty small{font-size:12px;font-weight:400;color:var(--mute);display:block}
.low .qty{color:var(--bad)}
.low{border-left:5px solid var(--bad)}
.ok{border-left:5px solid var(--ok)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#e8ebe6;margin-right:4px}
.tag.bad{background:#f6dcd8;color:var(--bad)}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stats div{flex:1;background:var(--ink);color:#fff;border-radius:10px;padding:10px}
.stats b{font-size:24px;display:block}
.stats span{font-size:12px;color:#aebccb}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--ink);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tab{flex:1;background:none;color:#aebccb;border-radius:0;padding:12px 2px;font-size:13px}
.tab.on{color:var(--ink);background:var(--hi)}
.in{color:var(--ok);font-weight:700}.out{color:var(--bad);font-weight:700}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.msg{position:fixed;left:14px;right:14px;bottom:88px;background:var(--ink);color:#fff;padding:12px;border-radius:10px;z-index:9;text-align:center}
.msg.err{background:var(--bad)}
h2{font-size:17px;margin:4px 0 10px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<header>
  <img src="icons/icon-192.png" alt="" onerror="this.style.display='none'">
  <div><h1>Central Stores Manager</h1><small id="sync">Stock in hand and issue out</small></div>
</header>
<main id="main"></main>
<nav>
  <button class="tab on" data-t="stock">Stock</button>
  <button class="tab" data-t="issue">Issue out</button>
  <button class="tab" data-t="receive">Receive</button>
  <button class="tab" data-t="history">History</button>
  <button class="tab" data-t="more">More</button>
</nav>
<script>
var KEY='csm-data-v1';
var D={items:[],log:[],sheet:''};
try{var s=localStorage.getItem(KEY);if(s)D=Object.assign(D,JSON.parse(s));}catch(e){}
var tab='stock',q='';
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){toast('Could not save on this device',1);}}
function $(id){return document.getElementById(id);}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function today(){return new Date().toISOString().slice(0,10);}
function toast(m,err){var d=document.createElement('div');d.className='msg'+(err?' err':'');d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove();},2600);}
function itemOpts(sel){return D.items.map(function(i){return '<option value="'+i.id+'"'+(i.id===sel?' selected':'')+'>'+esc(i.name)+' ('+i.qty+' '+esc(i.unit)+')</option>';}).join('');}
function find(id){return D.items.filter(function(i){return i.id===id;})[0];}
function noItems(){return '<div class="empty">No items yet.<br><br><button class="hi" onclick="go(\'more\')">Add your first item</button></div>';}

function render(){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab);});
  var m=$('main');
  if(tab==='stock')m.innerHTML=vStock();
  else if(tab==='issue')m.innerHTML=vMove('out');
  else if(tab==='receive')m.innerHTML=vMove('in');
  else if(tab==='history')m.innerHTML=vHistory();
  else m.innerHTML=vMore();
  if(tab==='stock'&&q){var s=$('q');s.focus();s.setSelectionRange(q.length,q.length);}
}
function go(t){tab=t;render();window.scrollTo(0,0);}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){go(b.dataset.t);};});

function vStock(){
  var low=D.items.filter(function(i){return i.qty<=i.min;}).length;
  var h='<div class="stats"><div><b>'+D.items.length+'</b><span>Items</span></div><div><b>'+low+'</b><span>Low or empty</span></div></div>';
  h+='<input id="q" type="search" placeholder="Search items or company" value="'+esc(q)+'" oninput="q=this.value;render()">';
  if(!D.items.length)return h+noItems();
  var L=D.items.filter(function(i){return (i.name+' '+i.company).toLowerCase().indexOf(q.toLowerCase())>-1;}).sort(function(a,b){return a.name.localeCompare(b.name);});
  if(!L.length)return h+'<div class="empty">No item matches "'+esc(q)+'".</div>';
  return h+L.map(function(i){var lw=i.qty<=i.min;
    return '<div class="card row '+(lw?'low':'ok')+'"><div class="grow"><div class="name">'+esc(i.name)+'</div><div class="sub">'+esc(i.company||'No company')+(lw?' <span class="tag bad">Low stock</span>':'')+'</div></div><div class="qty">'+i.qty+'<small>'+esc(i.unit)+'</small></div></div>';}).join('');
}
function vMove(t){
  if(!D.items.length)return noItems();
  var out=t==='out';
  return '<h2>'+(out?'Issue items out':'Receive stock')+'</h2><div class="card">'+
  '<label>Item</label><select id="mi">'+itemOpts()+'</select>'+
  '<label>Quantity</label><input id="mq" type="number" inputmode="decimal" min="0" step="any" placeholder="0">'+
  '<label>'+(out?'Issued to (name or department)':'Received from / note')+'</label><input id="mn" placeholder="'+(out?'e.g. Workshop, John Mwansa':'e.g. Supplier, delivery note')+'">'+
  '<label>Date</label><input id="md" type="date" value="'+today()+'">'+
  '<button class="'+(out?'hi':'')+' full" onclick="move(\''+t+'\')">'+(out?'Issue out':'Add to stock')+'</button></div>';
}
function move(t){
  var it=find($('mi').value),n=parseFloat($('mq').value),note=$('mn').value.trim(),d=$('md').value||today();
  if(!it)return toast('Choose an item',1);
  if(!(n>0))return toast('Enter a quantity above 0',1);
  if(t==='out'&&n>it.qty)return toast('Only '+it.qty+' '+it.unit+' in stock',1);
  if(t==='out'&&!note)return toast('Enter who it is issued to',1);
  it.qty=Math.round((it.qty+(t==='out'?-n:n))*1000)/1000;
  D.log.unshift({id:uid(),date:d,type:t==='out'?'Issued':'Received',itemId:it.id,name:it.name,qty:n,note:note,after:it.qty});
  save();toast((t==='out'?'Issued: ':'Added: ')+n+' '+it.unit+' '+it.name+'. Left: '+it.qty);
  autoSync();go('stock');
}
function vHistory(){
  if(!D.log.length)return '<div class="empty">No movements yet. Issue or receive an item and it appears here.</div>';
  return '<h2>History</h2>'+D.log.slice(0,200).map(function(l){var o=l.type==='Issued';
    return '<div class="card"><div class="row"><div class="grow name">'+esc(l.name)+'</div><div class="'+(o?'out':'in')+'">'+(o?'-':'+')+l.qty+'</div></div><div class="sub">'+esc(l.date)+' · '+esc(l.type)+(l.note?' · '+esc(l.note):'')+' · balance '+l.after+'</div></div>';}).join('');
}
function vMore(){
  return '<h2>Add item</h2><div class="card"><label>Item name</label><input id="an" placeholder="e.g. Safety boots size 9">'+
  '<label>Company</label><input id="ac" list="cos" placeholder="e.g. KoBold Metals"><datalist id="cos"><option value="ZCCM-IH"><option value="KoBold Metals"><option value="IFS"></datalist>'+
  '<div class="row"><div class="grow"><label>Unit</label><input id="au" placeholder="pcs, box, litres"></div><div class="grow"><label>Opening qty</label><input id="aq" type="number" inputmode="decimal" min="0" step="any" value="0"></div><div class="grow"><label>Low at</label><input id="am" type="number" inputmode="decimal" min="0" step="any" value="0"></div></div>'+
  '<button class="hi full" onclick="addItem()">Save item</button></div>'+
  '<h2>Google Sheet link</h2><div class="card"><div class="sub" style="margin-bottom:8px">Paste the Web app URL from the Apps Script. Every issue and receipt then updates the sheet.</div><input id="su" placeholder="https://script.google.com/macros/s/.../exec" value="'+esc(D.sheet)+'"><div class="row"><button class="grow" onclick="saveSheet()">Save link</button><button class="grow ghost" onclick="syncNow(1)">Send now</button></div></div>'+
  '<h2>Backup</h2><div class="card"><div class="row"><button class="grow ghost" onclick="csv()">Download CSV</button><button class="grow ghost" onclick="backup()">Backup file</button></div><hr><label>Restore from a backup file</label><input type="file" accept=".json" onchange="restore(this)"></div>'+
  (D.items.length?'<h2>Edit or remove</h2>'+D.items.map(function(i){return '<div class="card row"><div class="grow"><div class="name">'+esc(i.name)+'</div><div class="sub">'+i.qty+' '+esc(i.unit)+' · low at '+i.min+'</div></div><button class="ghost" onclick="editItem(\''+i.id+'\')">Edit</button><button class="ghost" onclick="delItem(\''+i.id+'\')">Delete</button></div>';}).join(''):'');
}
function addItem(){
  var n=$('an').value.trim();if(!n)return toast('Enter the item name',1);
  if(D.items.some(function(i){return i.name.toLowerCase()===n.toLowerCase()&&i.company===$('ac').value.trim();}))return toast('This item already exists',1);
  var qty=parseFloat($('aq').value)||0,it={id:uid(),name:n,company:$('ac').value.trim(),unit:$('au').value.trim()||'pcs',qty:qty,min:parseFloat($('am').value)||0};
  D.items.push(it);
  if(qty>0)D.log.unshift({id:uid(),date:today(),type:'Received',itemId:it.id,name:it.name,qty:qty,note:'Opening stock',after:qty});
  save();toast('Saved: '+n);autoSync();render();
}
function editItem(id){
  var i=find(id),n=prompt('Item name',i.name);if(n===null)return;
  var u=prompt('Unit',i.unit);if(u===null)return;
  var m=prompt('Low stock level',i.min);if(m===null)return;
  var c=prompt('Company',i.company);if(c===null)return;
  i.name=n.trim()||i.name;i.unit=u.trim()||i.unit;i.min=parseFloat(m)||0;i.company=c.trim();
  save();autoSync();render();toast('Updated');
}
function delItem(id){var i=find(id);if(!confirm('Delete '+i.name+'? Its history stays in the log.'))return;D.items=D.items.filter(function(x){return x.id!==id;});save();autoSync();render();}

function payload(){return JSON.stringify({items:D.items,log:D.log});}
function syncNow(show){
  if(!D.sheet)return show&&toast('Paste the Google Sheet link first',1);
  if(!navigator.onLine)return show&&toast('No internet. It will send next time.',1);
  fetch(D.sheet,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:payload()})
    .then(function(){$('sync').textContent='Sheet updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(show)toast('Sent to Google Sheet');})
    .catch(function(){if(show)toast('Could not reach the sheet',1);});
}
function autoSync(){if(D.sheet)syncNow(0);}
function saveSheet(){D.sheet=$('su').value.trim();save();toast(D.sheet?'Link saved':'Link removed');}
function dl(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
function csv(){
  var r=[['Item','Company','Unit','In stock','Minimum']].concat(D.items.map(function(i){return [i.name,i.company,i.unit,i.qty,i.min];}));
  r.push([]);r.push(['Date','Type','Item','Qty','Person / note','Balance after']);
  D.log.forEach(function(l){r.push([l.date,l.type,l.name,l.qty,l.note,l.after]);});
  dl('central-stores-'+today()+'.csv',r.map(function(x){return x.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(',');}).join('\n'),'text/csv');
}
function backup(){dl('stores-backup-'+today()+'.json',JSON.stringify(D),'application/json');}
function restore(inp){
  var f=inp.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var x=JSON.parse(r.result);if(!x.items||!x.log)throw 0;if(!confirm('Replace all current data with this backup?'))return;D=Object.assign({sheet:D.sheet},x);save();render();toast('Backup restored');}catch(e){toast('That file is not a valid backup',1);}};
  r.readAsText(f);
}
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
render();
</script>
</body>
</html>
